[package]
name = "noeta-para-p2p"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/noeta-lang/para-p2p"
rust-version = "1.95"

[dependencies]
# The convergence core (dep-free CRDTs) and the extension ABI.
noeta-crdt = { path = "../noeta-crdt" }
# file:// + rev is the pre-publish form; flips to { git = "https://github.com/noeta-lang/noeta", tag = "vX" } at publish.
noeta-ext-abi = { git = "file:///home/niklas/Code/lang", rev = "6c32f8d05a273192dea4bedd46d5f22c57d52419" }
# `synced` is a node in the SAME reactive graph as core `std.reactive`, reached through the
# `ReactiveSource` **capability** (`noeta_ext_abi::capability::<dyn ReactiveSource>`): create_source /
# read_source / wake + the view-source hook — never the engine internals. The contract lives in the
# tiny `noeta-reactive-abi` crate, so this extension depends on **nothing of `noeta-stdlib`**; the
# engine implements the same trait on the other side. noeta-reactive supplies the `NodeId` handle.
# file:// + rev is the pre-publish form; flips to { git = "https://github.com/noeta-lang/noeta", tag = "vX" } at publish.
noeta-reactive = { git = "file:///home/niklas/Code/lang", rev = "6c32f8d05a273192dea4bedd46d5f22c57d52419" }
# file:// + rev is the pre-publish form; flips to { git = "https://github.com/noeta-lang/noeta", tag = "vX" } at publish.
noeta-reactive-abi = { git = "file:///home/niklas/Code/lang", rev = "6c32f8d05a273192dea4bedd46d5f22c57d52419" }
# The real p2panda transport (para-namespace F2b). Optional and behind the `ring-p2p` ring: when a
# host permits real networking (`RealHost`) this crate owns a live p2panda node; off ⇒ the extension
# uses only the dep-free loopback broker, so a loopback/wasm build never links iroh/QUIC.
# (Historical: this once needed an `iroh-gossip` git `[patch]` in the workspace Cargo.toml; the
# patch is gone — iroh-gossip resolves from crates.io — so don't go looking for it.)
noeta-para-p2p-net = { path = "../noeta-para-p2p-net", optional = true }

[features]
# The real-transport ring — **not** default (footprint-gated, like the base's http/datetime rings).
# The composed toolchain/runner enables it (so `noeta run`/`--exe` have real peer networking); the
# AOT footprint scan enables it only for a `--native` binary that imports `para.p2p`/`para.synced`,
# shedding the whole p2panda tree otherwise. Plain `cargo build`/tests link no p2panda — the extension
# uses only its dep-free loopback broker.
ring-p2p = ["dep:noeta-para-p2p-net"]

[dev-dependencies]
# The para-conformance harness runs this crate's moved fixtures with `ParaP2pExtension` registered
# (the fixtures resolve `para.*`, which the default std-only registry cannot).
# file:// + rev is the pre-publish form; flips to { git = "https://github.com/noeta-lang/noeta", tag = "vX" } at publish.
noeta-conformance = { git = "file:///home/niklas/Code/lang", rev = "6c32f8d05a273192dea4bedd46d5f22c57d52419" }
# **Test-only** (a dev-dependency — it does not ship): the harness installs the full `std` runtime so
# the fixtures actually execute. The library itself depends on nothing of `noeta-stdlib` — it reaches
# the reactive engine purely through the `noeta-reactive-abi` capability contract.
# file:// + rev is the pre-publish form; flips to { git = "https://github.com/noeta-lang/noeta", tag = "vX" } at publish.
noeta-stdlib = { git = "file:///home/niklas/Code/lang", rev = "6c32f8d05a273192dea4bedd46d5f22c57d52419" }

# Inlined from the monorepo's [workspace.lints] (this crate is standalone now).
[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }

[workspace]
