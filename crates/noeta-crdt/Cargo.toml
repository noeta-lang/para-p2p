[package]
name = "noeta-crdt"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/noeta-lang/para-p2p"
rust-version = "1.95"

[dependencies]
# Wire serialization (p2p P2.0): CRDT state crosses the P2p byte seam, so a Mergeable value must be
# sendable. serde derive + postcard (compact, deterministic, no_std+alloc) — the same postcard the
# rest of the noeta ecosystem pins. This is the one dependency the convergence core carries, and only
# because serialization is genuinely part of a replicated type's contract.
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }

[dev-dependencies]
proptest = "1"

# Inlined from the monorepo's [workspace.lints] (this crate is standalone now).
[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }

[workspace]
