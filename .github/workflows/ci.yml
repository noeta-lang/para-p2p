name: CI

# The para/p2p package's CI, two jobs:
#   - rust     : fmt / clippy (deny warnings) / test in each Rust crate (the CRDT core, the
#                extension, the p2panda transport, the native entry crate), each its own workspace
#                root, plus the `ring-p2p` feature check (the real-transport ring must keep
#                compiling even though default builds never link p2panda — mirrors the old
#                monorepo CI gate).
#   - examples : the Noeta-level gate — install a pinned released `noeta`, then check + test the
#                example program (composing the toolchain builds the native crates, so the Rust
#                toolchain is installed here too).
#
# NOTE: these workflows go green once the noeta toolchain repo is published under
# github.com/noeta-lang/noeta and this repo's pre-publish `file:///` git deps are flipped to it
# (tracked in the pre-alpha run-list). Until then they fail at the git-dep fetch / noeta-install
# steps by design.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The Rust toolchain is PINNED (dtolnay/rust-toolchain@1.97.0, in lockstep with the toolchain
# repo's own CI) rather than floating on `@stable` — clippy's lint set grows each release and the
# rust job denies warnings. NOETA_VERSION is the toolchain release the examples are proven against.
# Bumping either is deliberate: raise it here and in `release.yml` together.
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  NOETA_VERSION: v0.1.0

jobs:
  rust:
    name: Rust crates (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Workspace-less on purpose (each crate is its own workspace root, so the composed toolchain
      # can adopt it as a path dependency) — run per crate directory.
      - name: cargo fmt --check
        run: |
          for crate in crates/*/ native/; do
            (cd "${crate}" && cargo fmt --check)
          done
      - name: cargo clippy (deny warnings)
        run: |
          for crate in crates/*/ native/; do
            (cd "${crate}" && cargo clippy --all-targets -- -D warnings)
          done
      - name: cargo test
        run: |
          for crate in crates/*/ native/; do
            (cd "${crate}" && cargo test)
          done
      # The real-transport ring (p2panda over iroh/QUIC) is off by default so plain builds link no
      # networking tree — keep it compiling anyway.
      - name: cargo check --features ring-p2p (real-transport ring)
        working-directory: crates/noeta-para-p2p
        run: cargo check --features ring-p2p

  examples:
    name: Examples (noeta check + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Composing a native package's toolchain cargo-builds the extension crates, so the Rust
      # toolchain is required even for the Noeta-side tests.
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - name: Install noeta ${{ env.NOETA_VERSION }}
        run: |
          DIST="noeta-${NOETA_VERSION}-x86_64-unknown-linux-gnu"
          curl -fsSL "https://github.com/noeta-lang/noeta/releases/download/${NOETA_VERSION}/${DIST}.tar.gz" | tar -xz
          echo "${PWD}/${DIST}" >> "$GITHUB_PATH"
      - name: noeta check + test every example
        run: |
          for ex in examples/*/; do
            echo "== ${ex}"
            for f in "${ex}"*.noe; do
              (cd "${ex}" && noeta check "$(basename "$f")" && noeta test "$(basename "$f")")
            done
          done
